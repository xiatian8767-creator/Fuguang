# Load in the existing port-80 edge proxy; a separate hostname never changes Star Orbit's routes.
server {
    listen 80;
    server_name fuguang.startimetable.xyz;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://fuguang.startimetable.xyz$request_uri; }
}
