name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify account and weekly quota service
        run: |
          python3 -m pip install -r backend/requirements.txt
          python3 -m unittest backend.test_app -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"; fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: fuguang-debug-signing-v1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download depth model
        run: |
          bash scripts/download_model.sh
          test $(wc -c < app/src/main/assets/depthanythingv2-vits-dynamic-quant.onnx) -gt 1000000
      - name: Verify GLES rendering regressions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1-mesa-dev libgl1-mesa-dev
          python3 scripts/test_gl_render.py
      - name: Build debug APK and device tests
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest lintDebug
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Verify album on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          script: python3 scripts/run_device_checks.py
      - name: Upload device verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-results
          path: |
            app/build/device-screenshots/
            app/build/device-test.log
            app/build/reports/androidTests/
            app/build/reports/lint-results-debug.html

      - uses: actions/upload-artifact@v4
        with:
          name: ParallaxWallpaper-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
