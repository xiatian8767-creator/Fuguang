<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>浮光 · 管理后台</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="brand" href="/">浮光 <small>运营管理</small></a><button id="logout" hidden>退出</button></header><main><div id="login" class="panel"><h2>管理员登录</h2><form id="loginForm"><label for="password">管理员密码</label><input id="password" type="password" autocomplete="current-password" required><p><button>登录后台</button></p></form></div><p id="status" role="status" class="status"></p><div id="dashboard" hidden><nav><button data-tab="users">用户管理</button><button data-tab="codes" class="secondary">兑换码</button><button data-tab="audit" class="secondary">操作记录</button></nav><section id="users"><h2>用户管理</h2><form id="search" class="toolbar"><input id="query" placeholder="搜索用户名" aria-label="搜索用户名"><button>搜索</button></form><p>每页100人。调整会员将替换当前权益；重置密码或停用账号会撤销用户登录。</p><div id="userTable" class="scroll"></div><div class="toolbar"><button id="userPrev">上一页</button><button id="userNext">下一页</button></div></section><section id="codes" hidden><h2>兑换码</h2><form id="batch" class="toolbar"><select id="plan" aria-label="卡类型"><option value="month">月卡</option><option value="year">年卡</option><option value="lifetime">永久卡</option></select><input id="count" type="number" min="1" max="100" value="10" aria-label="生成数量"><button>生成兑换码</button></form><div id="newCodes" class="panel" hidden><h3>请立即保存，完整兑换码只展示这一次</h3><textarea id="codeOutput" readonly aria-label="新生成的兑换码"></textarea><p><button id="export">下载 TXT</button></p></div><div id="codeTable" class="scroll"></div><div class="toolbar"><button id="codePrev">上一页</button><button id="codeNext">下一页</button></div></section><section id="audit" hidden><h2>操作记录</h2><div id="auditTable" class="scroll"></div></section></div></main><script src="/admin/admin.js"></script><script src="/admin/campaigns.js"></script></body></html>
